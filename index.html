<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce</title>
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>

    <section class="announcement-sec">
        <div class="bg-black text-light text-center py-2">
            <p class="mb-0 fs-6 text-capitalize">
                Summer Sale For All Tech Items And Free Express Delivery - OFF 50%!
            </p>
        </div>
    </section>

    <div class="container">

        <section class="nav-sec mt-2">
            <nav class="navbar px-4 py-3">
                <div class="container-fluid d-flex align-items-center justify-content-between">
                    <p class="fs-3 text-nowrap mb-0">Company Logo</p>
                    <ul class="d-flex list-unstyled mb-0 gap-4">
                        <li><a href="#" class="nav-link">Home</a></li>
                        <li><a href="#" class="nav-link">Contact</a></li>
                        <li><a href="#" class="nav-link">About</a></li>
                        <li><a href="#" class="nav-link">Sign Up</a></li>
                    </ul>

                    <div class="d-flex align-items-center gap-3">
                        <div class="d-flex align-items-center bg-light px-3 py-1 rounded" style="min-width: 220px;">
                            <input type="search" class="border-0 bg-transparent flex-grow-1 small"
                                placeholder="What are you looking for?" style="outline: none;">
                            <i class="bi bi-search text-muted"></i>
                        </div>
                        <a href="#" class="text-dark fs-5">
                            <i class="bi bi-heart"></i>
                        </a>
                        <a href="#" class="text-dark fs-5">
                            <i class="bi bi-cart2"></i>
                        </a>
                    </div>
                </div>
            </nav>
        </section>

        <section class="hero-sec mt-5">
            <div class="row">
                <div class="col-lg-3">
                    <ul class="list-unstyled mx-4">
                        <li><a href="#" class="nav-link pt-2">Computers & PCs</a></li>
                        <li><a href="#" class="nav-link pt-2">Laptops</a></li>
                        <li><a href="#" class="nav-link pt-2">Components</a></li>
                        <li><a href="#" class="nav-link pt-2">Monitors</a></li>
                        <li><a href="#" class="nav-link pt-2">Gaming</a></li>
                        <li><a href="#" class="nav-link pt-2">Storage Devices</a></li>
                        <li><a href="#" class="nav-link pt-2">Networking</a></li>
                        <li><a href="#" class="nav-link pt-2">Printers & Scanners</a></li>
                        <li><a href="#" class="nav-link pt-2">Accessories</a></li>
                    </ul>
                </div>

                <div class="col-lg-9 bg-dark">
                    <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <img src="assets/images/banners/1.jpg" class="d-block w-100" alt="Slide 1">
                            </div>
                            <div class="carousel-item">
                                <img src="assets/images/banners/2.jpg" class="d-block w-100" alt="Slide 2">
                            </div>
                            <div class="carousel-item">
                                <img src="https://via.placeholder.com/800x400?text=Slide+3" class="d-block w-100"
                                    alt="Slide 3">
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
